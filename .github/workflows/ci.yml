name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (hermetic)
        run: npm ci
      - name: Build
        run: npm run build
      - name: SEO check
        run: node scripts/check-seo.mjs
      - name: Site check
        run: node scripts/check-site.mjs
